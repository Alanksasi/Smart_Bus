<!DOCTYPE html>
<html>
<head>
<title>Seat Booking</title>

<style>
.seat-container{
    display:grid;
    gap:10px;
    justify-content:center;
}

/* 2x2 layout */
.layout-2x2{
    grid-template-columns: repeat(2,60px) 40px repeat(2,60px);
}

/* 2x3 layout */
.layout-2x3{
    grid-template-columns: repeat(2,60px) 40px repeat(3,60px);
}
.seat{
    width:55px;
    height:55px;
    border:none;
    border-radius:8px;
    font-weight:bold;
}

.available{
    background:green;
    color:white;
}

.booked{
    background:red;
    color:white;
}

.aisle{
    visibility:hidden;
}
</style>

</head>
<body>

<h2>{{ bus.name }} Seat Layout</h2>

<!-- Dynamic KSRTC layout -->
<div class="seat-container
{% if bus.seat_type == '2x2' %}
layout-2x2
{% else %}
layout-2x3
{% endif %}
">

{% for seat in seats %}
    {% if seat.id in booked_seats %}
        <button class="seat booked">{{ seat.seatno }}</button>
    {% else %}
        <a href="{% url 'passenger:book_seat' trip.id seat.id %}">
            <button class="seat available">
                {{ seat.seatno }}
            </button>
        </a>
    {% endif %}
{% endfor %}

</div>

</body>
</html>
