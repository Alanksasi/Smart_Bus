{% load static %}
{% include 'layout/partials/operator/header.html' %}

<div class="container-fluid pt-4 px-4">
    <div class="row">
        <div class="bg-secondary rounded h-100 p-4">
            <h6 class="mb-4">Bus Registration</h6>

            <form action="{% url 'operator:busreg' %}" method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="label">Name of Bus</label>
                    <input type="text" class="form-control" name="name" required>
                    <div class="form-text">Please enter the name of bus here.</div>
                </div>

                <div class="mb-3">
                    <label class="label">Bus No</label>
                    <input type="text" class="form-control" name="num" required>
                    <div class="form-text">Please enter the bus number.</div>
                </div>

                <div class="mb-3">
                    <label class="label">Contact</label>
                    <input type="text" class="form-control" name="contact" required>
                    <div class="form-text">Please enter the contact number.</div>
                </div>

                <!-- ✅ NEW: Seat Configuration -->
                <div class="mb-3">
                    <label class="label">Seat Configuration</label>
                    <select name="seat_type" class="form-control" required>
                        <option value="">-- Select Seat Type --</option>
                        <option value="2x2">2 x 2</option>
                        <option value="2x3">2 x 3</option>
                    </select>
                </div>

                <!-- ✅ NEW: Total Rows -->
                <div class="mb-3">
                    <label class="label">Total Rows</label>
                    <input type="number" name="total_rows" class="form-control" min="1" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Register
                </button>
            </form>

        </div>
    </div>
</div>

{% include 'layout/partials/operator/footer.html' %}
