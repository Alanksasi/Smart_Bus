{% load static %}
{% include 'layout/partials/operator/header.html' %}
<div class="container-fluid pt-4 px-4">
    <div class="row">
        <div class="bg-secondary rounded h-100 p-4">
            <h6 class="mb-4">Bus Edit</h6>
            <form action="{% url 'operator:busup' busv.id %}" method="post">
            {% csrf_token %}
                <div class="mb-3">
                    <label for="name" class="label">Name of Bus</label>
                    <input type="text" class="form-control" id="exampleInputEmail1" name="name" value="{{ busv.name }}" aria-describedby="emailHelp">
                    <div id="emailHelp" class="form-text">Please enter the name of bus here.</div>
                </div>
                <div class="mb-3">
                    <label for="name" class="label">Bus No</label>
                    <input type="text" class="form-control" id="exampleInputEmail1" name="num" value="{{ busv.num }}" aria-describedby="emailHelp">
                    <div id="emailHelp" class="form-text">Please enter the data here.</div>
                </div>
                <div class="mb-3">
                    <label for="name" class="label">Contact</label>
                    <input type="text" class="form-control" id="exampleInputEmail1" name="contact" value="{{ busv.contact }}" aria-describedby="emailHelp">
                    <div id="emailHelp" class="form-text">Please enter the Contact here.</div>
                </div>
                <button type="submit" class="btn btn-primary">Update</button>
            </form>
        </div>
    </div>
</div>
{% include 'layout/partials/operator/footer.html' %}
