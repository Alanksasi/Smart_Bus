{% load static %}
{% include 'layout/partials/operator/header.html' %}
<div class="col-sm-12 col-xl-12">
                        <div class="bg-secondary rounded h-100 p-4">
                            <h6 class="mb-4">Route View</h6>
                            <table class="table table-dark">
                                <thead>
                                    <tr>
                                        <th scope="col">Nos</th>
                                        <th scope="col">Route Name</th>
                                        <th scope="col">Update</th>
                                        <th scope="col">Delete</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% for i in routev %}
                                    <tr>
                                        <th scope="row">{{ forloop.counter }}</th> 
                                        <td>{{ i.name }}</td>
                                        <td><a href="{% url 'operator:routeup' i.id %}"><button type="submit" class="btn bg-secondary">Update</button></a></td>   
                                        <td><a href="{% url 'operator:routedl' i.id %}"><button type="submit" class="btn btn-primary">Delete</button></a></td>                                         
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </div>
{% include 'layout/partials/operator/footer.html' %}
