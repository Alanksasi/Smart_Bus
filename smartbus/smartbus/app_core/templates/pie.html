{% load static %}
{% include 'layout/partials/admin/header.html' %} 
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script> 
<div class="container"> 
    <div class="page-inner"> 
        <div class="row"> 
            <div class="col-md-6"> 
                <div class="card"> 
                    <div class="card-header"> 
                        <div class="card-title">Booking Distribution by Seller</div> 
                    </div> 
                    <div class="card-body"> 
                        <div class="chart-container" style="min-height: 300px"> 
                            <canvas id="sellerPieChart" width="300" height="300"></canvas> 
                        </div> 
                    </div> 
                </div> 
            </div> 
        </div> 
    </div> 
</div> 
<script>
 const ctx = document.getElementById('sellerPieChart').getContext('2d'); 
 const sellerPieChart = new Chart(ctx, {
    type: 'pie', 
    data: { 
        labels: {{ labels| safe }}, 
datasets: [{ 
    data: {{ data| safe }}, 
    backgroundColor: [ 
    '#FF6384', 
    '#36A2EB', 
    '#FFCE56', 
    '#4BC0C0', 
    '#9966FF', 
    '#FF9F40' 
] 
    }] 
}, 
    options: { 
        responsive: true, 
        plugins: { 
        legend: { 
            position: 'right', 
            } } 
    } 
    }); 
</script> 
</body> 
</html> 
{% include 'layout/partials/admin/footer.html' %}
